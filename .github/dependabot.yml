version: 2
updates:
  # Workflow actions are pinned to full commit SHAs; this keeps the pins
  # current instead of frozen at whatever was latest when they were added.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(ci)"
    groups:
      github-actions:
        patterns: ["*"]
