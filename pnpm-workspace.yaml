packages:
  - apps/*
  - services/*
  - tests/*
  - docs

allowBuilds:
  "@parcel/watcher": true
  # Deliberately false. 13.x dropped the `prebuild-install || node-gyp rebuild`
  # install script and ships N-API prebuilds instead, but it still carries a
  # binding.gyp — and pnpm auto-runs `node-gyp rebuild` for an allowed package
  # that has one and no install script. That compile is pure waste when a
  # working prebuild is already in the tarball, and it needs `make`, which the
  # Playwright images the e2e jobs run in do not have.
  better-sqlite3: false
  esbuild: true
  lefthook: true
  msgpackr-extract: true
  msw: true
  protobufjs: true
  sharp: true
  vue-demi: true
  workerd: true

catalog:
  "@changesets/cli": ^2.31.1
  "@electric-sql/pglite": ^0.5.4
  "@fontsource-variable/merriweather": ^5.3.0
  "@hono/cli": ^0.1.11
  "@hono/node-server": ^2.1.0
  "@hono/node-ws": ^1.3.0
  "@hono/zod-openapi": ^1.5.1
  "@loglayer/hono": ^2.4.0
  "@loglayer/plugin-opentelemetry": ^3.3.0
  "@loglayer/transport-opentelemetry": ^4.3.0
  "@loglayer/transport-pino": ^3.3.0
  "@loglayer/transport-pretty-terminal": ^6.3.0
  "@nuxt/ui": ^4.10.0
  "@opentelemetry/api": ^1.9.1
  "@opentelemetry/sdk-logs": ^0.221.0
  "@opentelemetry/sdk-node": ^0.221.0
  "@opentelemetry/sdk-trace-node": ^2.10.0
  "@pinia/colada": ^1.4.2
  "@playwright/test": 1.62.1
  "@scalar/hono-api-reference": ^0.11.13
  "@types/better-sqlite3": ^9.6.0
  # Track the runtime major (.node-version / engines.node) so the ambient types
  # match the APIs actually available at runtime.
  "@types/node": ^26.1.2
  "@unhead/vue": ^3.3.1
  "@vitejs/plugin-vue": ^6.0.8
  "@vue/test-utils": ^2.4.11
  "@vueuse/core": ^14.4.0
  # Auth
  # The apiKey plugin ships as its own package — it is not re-exported from
  # `better-auth/plugins`. Keep its version pinned in step with better-auth;
  # it declares a `@better-auth/core` peer and mismatched majors break the
  # plugin contract.
  "@better-auth/api-key": ^1.6.26
  bcryptjs: ^3.0.3
  better-auth: ^1.6.26
  # >=12.10 required to compile against Node 26's V8 headers (12.6 fails to build)
  better-sqlite3: ^13.0.3
  # Queue
  bullmq: ^6.0.9
  # File watching
  chokidar: ^5.0.0
  dotenv: ^17.4.2
  dotenv-cli: ^11.0.0
  # Database
  # Move both together — same release train. The 1.0.0-beta line is deprecated
  # on npm; `rc` is the current dist-tag for both packages.
  drizzle-kit: 1.0.0-rc.4
  drizzle-orm: 1.0.0-rc.4
  echarts: ^6.0.0
  fast-xml-parser: 5.10.1
  happy-dom: ^20.11.1
  hono: ^4.13.1
  ioredis: ^6.0.0
  iron-webcrypto: ^2.0.0
  lefthook: ^2.1.10
  loglayer: ^9.4.0
  mermaid: ^11.13.0
  # Mock Service Worker
  msw: ^2.15.0
  # HTTP
  ofetch: ^1.5.1
  # Required peer of vitepress@2 when running on rolldown-vite (vite-plus).
  oxc-minify: ^0.143.0
  pinia: ^4.0.2
  pino: ^10.3.1
  postgres: ^3.4.9
  serialize-error: ^13.0.1
  tailwindcss: ^4.3.3
  # Lightweight, dependency-free language detection (ISO 639-1 codes)
  tinyld: ^1.3.4
  tsx: ^4.23.11
  typescript: ^6.0.3
  # Aliased so transitive peer-dep resolutions (e.g. @vitejs/plugin-vue)
  # deduplicate to vite-plus-core instead of pulling a separate Vite from npm.
  # Pinned exactly to the core version vite-plus itself depends on — a floating
  # range can drift to a core release the installed vite-plus doesn't expect.
  vite: npm:@voidzero-dev/vite-plus-core@0.2.8
  # Pinned exact: Vite+ 0.x minors are breaking (0.2.0 replaced the bundled
  # Vitest wrapper with upstream Vitest), so upgrades should be deliberate.
  vite-plus: 0.2.8
  vitepress: 2.0.0-alpha.17
  vitepress-mermaid-renderer: ^1.1.30
  vitepress-openapi: ^0.2.3
  vitepress-sidebar: ^1.38.0
  # No `vitest` entry: as of Vite+ 0.2.0 the @voidzero-dev/vite-plus-test
  # wrapper is gone and upstream vitest arrives transitively via vite-plus.
  vue: ^3.5.41
  vue-echarts: ^8.1.0
  vue-router: 5.2.0
  vue-tsc: ^3.3.9
  wrangler: ^4.120.0
  zod: ^4.3.6

catalogMode: prefer
overrides:
  "@opentelemetry/api-logs": 0.218.0
  # Force every transitive `vite` onto vite-plus-core. There is deliberately no
  # `vitest` override — vite-plus 0.2.x depends on upstream vitest directly, so
  # letting pnpm resolve it normally keeps it deduped with the @vitest/* packages
  # vite-plus pins alongside it.
  vite: "catalog:"
peerDependencyRules:
  # Packages declaring a `vite` peer (@vitejs/plugin-vue, vitepress, …) see
  # vite-plus-core's version string, which doesn't satisfy their `^7`/`^8` ranges.
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
    # better-auth's Drizzle adapter still declares `drizzle-orm: ^0.45.2`, but
    # this repo runs the drizzle 1.0 line. Scoped to those two packages rather
    # than blanket-allowing drizzle-orm, so a genuine mismatch elsewhere still
    # warns.
    #
    # This is a WARN, not a blocker: `vp install` exits 0 either way, and the
    # warning text is identical on beta.21 and rc.4 because both fail `^0.45.2`
    # equally. Do not read it as "the RC is incompatible" — it says nothing
    # about which 1.0 release is installed.
    #
    # The adapter has no type coupling to drizzle-orm at all (it declares
    # `interface DB { [key: string]: any }`); its only coupling is a runtime
    # import of drizzle's operator functions. Verified against 1.0.0-rc.4:
    # create, findOne, update, findMany+count and the apiKey plugin's own table
    # all work (lib/auth.integration.test.ts drives the real adapter against
    # PGlite). This is unsupported-by-upstream territory — re-run that suite on
    # every upgrade of either package.
    "better-auth>drizzle-orm": "*"
    "@better-auth/drizzle-adapter>drizzle-orm": "*"
packageExtensions:
  "@nuxt/icon":
    dependencies:
      h3: ^1.15.5
  "@voidzero-dev/vite-plus-core":
    dependencies:
      picomatch: ^4.0.4
