# Use upstream nixos-unstable directly instead of devenv's default
# cachix/devenv-nixpkgs/rolling fork. Rationale: rolling currently lags on
# pnpm (caps at 10.x) and node (no nodejs_26), whereas nixos-unstable ships
# pnpm 11 and nodejs_26. Trade-off: we forgo devenv's curated patches on the
# rolling channel.
#
# INVARIANT: the nixpkgs pin below decides which `playwright-driver` version
# (and therefore which bundled Chromium revision) `devenv.nix` exports via
# PLAYWRIGHT_BROWSERS_PATH for host runs. Playwright resolves that directory
# from the revision compiled into the *client*, so the catalog's
# `@playwright/test` pin in pnpm-workspace.yaml must equal the nixpkgs
# `playwright-driver` version — otherwise `vp run -F @libris/e2e e2e` on the
# host dies with `Executable doesn't exist at .../chromium-<rev>/...`.
# After any `devenv update`, compare the two and bump them together:
#   nix eval --raw "github:NixOS/nixpkgs/$(jq -r '.nodes.nixpkgs.locked.rev' devenv.lock)#playwright-driver.version"
#   grep '@playwright/test' pnpm-workspace.yaml
# Then move the catalog pin, both ci.yml container tags and the
# docker-compose.test.yml image together — see contributing.md § Host browser
# cache. Container runs in the pinned Playwright image are unaffected: the
# image ships its own browsers.
inputs:
  nixpkgs:
    url: github:NixOS/nixpkgs/nixos-unstable
