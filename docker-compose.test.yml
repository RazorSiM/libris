# Test-only services — isolated from development databases
# Usage: ./scripts/test-e2e.sh (recommended)
# Manual:
#   Start backing services:   docker compose -f docker-compose.test.yml up -d --wait postgres redis
#   Run E2E in container:     docker compose -f docker-compose.test.yml --profile e2e run --rm playwright

services:
  postgres:
    image: postgres:17
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: libris_test
      POSTGRES_USER: libris_test
      POSTGRES_PASSWORD: libris_test
      # Off /var/lib/postgresql/data on purpose: that path is a declared VOLUME
      # in the postgres image, and podman then rejects the tmpfs below as a
      # "duplicate mount destination". Any path outside the image's volumes works.
      PGDATA: /pgdata
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U libris_test -d libris_test"]
      interval: 2s
      timeout: 5s
      retries: 10
    tmpfs:
      - /pgdata

  redis:
    image: redis:7
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 10

  # Playwright runs in the official image so the bundled chromium matches the
  # @playwright/test version pinned in pnpm-workspace.yaml. Native modules
  # (better-sqlite3, etc.) compiled on a NixOS host don't load in this Ubuntu
  # image, so each workspace's node_modules is a named volume populated by an
  # in-container `pnpm install` (cached across runs).
  #
  # The image ships Node 24, below this workspace's `engines.node` floor of
  # >=26, so the entrypoint provisions the pinned Node from .node-version via
  # `n` before installing. CI gets the same result a different way — its
  # playwright container runs setup-vp with node-version-file.
  playwright:
    image: mcr.microsoft.com/playwright:v1.60.0-noble
    profiles: ["e2e"]
    working_dir: /repo
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: libris_test
      POSTGRES_PASSWORD: libris_test
      POSTGRES_DB: libris_test
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      NODE_ENV: development
      LIBRIS_COOKIE_SECURE: "0"
      LIBRIS_INBOX_PATH: /repo/tmp/test-inbox
      LIBRIS_LIBRARY_PATH: /repo/tmp/test-library
      # Throwaway, but generated with `openssl rand -hex 32`: the API rejects
      # published placeholders and low-diversity secrets at startup, and
      # middleware/auth.ts refuses a TEST_ROUTE_TOKEN under 32 bytes by 401ing
      # every /__test/ call rather than failing loudly.
      API_SECRET_KEY: 1e368ee3513dd6e7807d83fdcca3e0a2dc06e66d70ab903298c5130740ca9669
      TEST_ROUTE_TOKEN: 2264bacc352498319d641fb2bc92228c83cda488e1bc8676e87623dfc8cd1455
      BETTER_AUTH_SECRET: f46f4321bb1c145197e08b5f773973faa4f70b0aefcdd9a3d09736e62b37a462
      MIGRATIONS_PATH: /repo/services/api-hono/migrations
      E2E_DOCKER: "1"
      # Turns off Better Auth's rate limiting (see lib/auth.ts) and enables the
      # /__test/* support routes. Without it the setup project's sign-in is the
      # third in a few seconds and gets throttled, which the UI can only report
      # as a failed login.
      E2E_TEST: "1"
      # Image bundles browsers at /ms-playwright; don't inherit a host override.
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      # Install `n`-managed Node and global npm bins into a cached volume rather
      # than over the image's /usr/local, so the toolchain survives between runs.
      N_PREFIX: /node-toolchain
    volumes:
      - ./:/repo
      - playwright-root-nm:/repo/node_modules
      - playwright-web-nm:/repo/apps/web/node_modules
      - playwright-api-nm:/repo/services/api-hono/node_modules
      - playwright-e2e-nm:/repo/tests/e2e/node_modules
      - playwright-docs-nm:/repo/docs/node_modules
      - playwright-pnpm-store:/root/.local/share/pnpm/store
      - playwright-node-toolchain:/node-toolchain
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    # Use entrypoint so any args passed to `docker compose run --rm playwright`
    # are forwarded to `playwright test` (e.g. a single spec file).
    #
    # Every `$` below is written `$$` so Compose's own variable interpolation
    # leaves it for the container's shell. A bare `$PATH` gets substituted at
    # parse time (to empty, since Compose doesn't inherit it), which nukes PATH
    # and the script dies with `node: command not found`.
    entrypoint:
      - bash
      - -lc
      - |
        set -euo pipefail
        # Shadow the image's /usr/bin/node with the N_PREFIX toolchain.
        export PATH="/node-toolchain/bin:$$PATH"
        # The image ships Node 24; install the version pinned in .node-version.
        # Lives in the cached volume, so this is a no-op after the first run.
        if [ "$$(node --version)" != "v$$(cat /repo/.node-version)" ]; then
          npm install -g n
          n install "$$(cat /repo/.node-version)"
          hash -r
        fi
        # Node 25+ dropped corepack, so pnpm is installed explicitly rather than
        # via `corepack enable` (the image's corepack belongs to its old Node).
        command -v pnpm >/dev/null || npm install -g pnpm@11.5.0
        pnpm install --frozen-lockfile
        cd tests/e2e
        exec pnpm exec playwright test "$$@"
      - --
    command: []

volumes:
  playwright-root-nm:
  playwright-web-nm:
  playwright-api-nm:
  playwright-e2e-nm:
  playwright-docs-nm:
  playwright-pnpm-store:
  playwright-node-toolchain:
